<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>鐵窗二選一</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="stage" aria-label="鐵窗二選一小遊戲">
        <div class="topbar">
          <div>
            <p class="eyebrow">Prison Mini Game</p>
            <h1>鐵窗二選一</h1>
          </div>
          <button class="icon-button" id="resetButton" title="重新開始" aria-label="重新開始">↻</button>
        </div>

        <div class="scoreboard">
          <div>
            <span>心情</span>
            <strong id="moodScore">50</strong>
          </div>
          <div>
            <span>清白值</span>
            <strong id="honorScore">50</strong>
          </div>
          <div>
            <span>相片荒謬度</span>
            <strong id="photoScore">0</strong>
          </div>
        </div>

        <section class="choice-screen" id="choiceScreen">
          <canvas id="heroCanvas" width="760" height="340" aria-label="監獄場景插圖"></canvas>
          <div class="choice-copy">
            <h2>今天你要走哪條路？</h2>
            <p>一邊是溫馨探監，一邊是被押去拍入監照。兩邊都很荒唐，但都能順利通關。</p>
          </div>
          <div class="choices">
            <button class="choice-card" data-route="visit">
              <span class="choice-icon">☏</span>
              <strong>探監</strong>
              <small>播電話、輸入幹話、看對方崩壞表情</small>
            </button>
            <button class="choice-card" data-route="photo">
              <span class="choice-icon">▦</span>
              <strong>入獄拍照</strong>
              <small>上傳人臉、輸入幹話、下載犯人照</small>
            </button>
          </div>
        </section>

        <section class="game-screen hidden" id="visitScreen" aria-label="探監遊戲">
          <div class="screen-header">
            <button class="back-button" data-back>←</button>
            <div>
              <p class="eyebrow">Route A</p>
              <h2>探監任務</h2>
            </div>
          </div>
          <div class="visit-layout">
            <div class="visitor-room">
              <div class="guard">探監室</div>
              <div class="visitation-booth">
                <div class="booth-glass">
                  <div class="glass-shine"></div>
                  <div class="inmate-face" id="inmateFace" data-expression="idle">
                    <div class="inmate-hair"></div>
                    <div class="inmate-eye left"></div>
                    <div class="inmate-eye right"></div>
                    <div class="inmate-mouth"></div>
                    <div class="inmate-sweat"></div>
                  </div>
                  <div class="speech-bubble" id="inmateReaction">電話還沒接通，他假裝沒看到你。</div>
                </div>
                <div class="phone-row">
                  <button id="callButton">播電話</button>
                  <div class="phone-status" id="phoneStatus">未接通</div>
                </div>
              </div>
            </div>
            <div class="panel">
              <h3>探監電話</h3>
              <p id="visitPrompt">先播電話，接通後輸入一句話罵對方，他會隨機露出 50 種荒謬表情。</p>
              <label>
                罵人內容
                <input id="insultInput" maxlength="36" value="你連泡麵調味包都撕歪" />
              </label>
              <div class="counter">
                <button id="insultButton" disabled>送出幹話</button>
                <button id="randomInsultButton">亂數一句</button>
              </div>
              <div class="progress-list">
                <span id="visitStep1">□ 電話接通</span>
                <span id="visitStep2">□ 送出幹話</span>
                <span id="visitStep3">□ 觸發荒謬表情</span>
              </div>
              <button id="finishVisitButton" disabled>完成探監嘴砲</button>
            </div>
          </div>
        </section>

        <section class="game-screen hidden" id="photoScreen" aria-label="入獄拍照遊戲">
          <div class="screen-header">
            <button class="back-button" data-back>←</button>
            <div>
              <p class="eyebrow">Route B</p>
              <h2>入獄拍照</h2>
            </div>
          </div>
          <div class="photo-layout">
            <div class="mugshot">
              <canvas id="mugshotCanvas" width="520" height="560" aria-label="犯人照產生器"></canvas>
              <div class="flash" id="flash"></div>
            </div>
            <div class="panel controls">
              <h3>拍照控制台</h3>
              <label>
                上傳人臉
                <input id="faceUpload" type="file" accept="image/*" />
              </label>
              <label>
                照片縮放
                <input id="faceScaleSlider" type="range" min="80" max="240" value="100" disabled />
              </label>
              <button id="resetFaceButton" disabled>置中照片</button>
              <label>
                上方幹話
                <input id="sloganInput" maxlength="24" value="我只是路過但姿勢很熟" />
              </label>
              <label>
                表情貼紙
                <select id="faceSelect">
                  <option value="blank">無辜呆住</option>
                  <option value="smirk">偷笑嘴臉</option>
                  <option value="panic">慌張爆汗</option>
                  <option value="proud">莫名自豪</option>
                </select>
              </label>
              <label>
                號碼牌
                <input id="plateInput" maxlength="10" value="NO. 9527" />
              </label>
              <label>
                髮型
                <input id="hairSlider" type="range" min="0" max="100" value="45" />
              </label>
              <div class="button-row">
                <button id="snapButton">拍照下載</button>
                <button id="randomButton">亂數造型</button>
              </div>
              <button id="downloadButton" disabled>下載目前照片</button>
              <p id="photoCaption">可以上傳照片替換人臉，再輸入自己的幹話。</p>
            </div>
          </div>
        </section>

        <dialog id="resultDialog">
          <h2 id="resultTitle">完成</h2>
          <p id="resultText"></p>
          <button id="closeDialogButton">繼續玩</button>
        </dialog>

        <dialog id="dialDialog" class="dial-dialog">
          <p class="eyebrow">Calling</p>
          <h2>正在撥號</h2>
          <div class="dial-phone" aria-hidden="true">☎</div>
          <p id="dialStatus">嘟... 嘟... 嘟...</p>
          <div class="dial-dots" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </dialog>
      </section>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
